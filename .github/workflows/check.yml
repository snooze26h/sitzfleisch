name: check

# 平时的 push 也要有检查：打包那个 workflow 只在 tag 和手动触发时跑，
# 等到发版才发现 tsc 挂了就太晚了。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # 跑在 macOS 上：src-tauri 的测试要编译 tauri 本体，
    # 在 Linux 上得先装一串 GTK/webkit 系统包，不值当。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            core
            src-tauri

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: 死代码扫描
        run: node scripts/check-dead-exports.mjs


      - name: 快照乱序回归
        run: node scripts/check-snapshot-order.mjs

      - name: 短名规则与 Rust 对齐
        run: node scripts/check-short-name.mjs

      - name: 调度边界与 Rust 对齐
        run: node scripts/check-scheduler.mjs

      - name: 时间轴暂停空隙回归
        run: node scripts/check-timeline.mjs

      - name: 精确网址输入与扩展回归
        run: |
          node scripts/check-blocking-rules.mjs
          node --test browser-extension/*.test.mjs

      - name: 安全边界回归
        run: node scripts/check-security.mjs

      - name: 规则引擎测试
        run: cargo test
        working-directory: core

      - name: 规则引擎 clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: core

      - name: 外壳测试
        run: cargo test
        working-directory: src-tauri

      - name: 外壳 clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
