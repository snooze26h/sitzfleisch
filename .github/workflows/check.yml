name: check

# 平时的 push 也要有检查：打包那个 workflow 只在 tag 和手动触发时跑，
# 等到发版才发现 tsc 挂了就太晚了。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # 跑在 macOS 上：src-tauri 的测试要编译 tauri 本体，
    # 在 Linux 上得先装一串 GTK/webkit 系统包，不值当。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            core
            src-tauri

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: 死代码扫描
        run: node scripts/check-dead-exports.mjs


      - name: 快照乱序回归
        run: node scripts/check-snapshot-order.mjs

      - name: 短名规则与 Rust 对齐
        run: node scripts/check-short-name.mjs

      - name: 调度边界与 Rust 对齐
        run: node scripts/check-scheduler.mjs

      - name: 时间轴暂停空隙回归
        run: node scripts/check-timeline.mjs

      - name: 精确网址输入与扩展回归
        run: |
          node scripts/check-blocking-rules.mjs
          node --test browser-extension/*.test.mjs

      - name: 安全边界回归
        run: node scripts/check-security.mjs

      - name: 规则引擎测试
        run: cargo test
        working-directory: core

      - name: 规则引擎 clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: core

      - name: 外壳测试
        run: cargo test
        working-directory: src-tauri

      - name: 外壳 clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # v3 默认还安装已下架的 tools；只安装有效的 platform-tools。
          packages: platform-tools

      - name: Android SDK 与 NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Android 调试 APK
        env:
          RUSTFLAGS: -D warnings
        run: npm run tauri android build -- --debug --apk --target aarch64 --ci
