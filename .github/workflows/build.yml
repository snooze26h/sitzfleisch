name: build

on:
  workflow_dispatch:
    inputs:
      android_only:
        description: "仅构建并签名 Android APK（签名 Secrets 必须齐全）"
        type: boolean
        required: false
        default: false
      supabase_url:
        description: "可选：与其他设备相同的 Supabase HTTPS 项目地址"
        type: string
        required: false
        default: ""
      supabase_publishable_key:
        description: "可选：与项目地址成对填写的 publishable/anon 公开密钥"
        type: string
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

# 仅传公开配置；外部输入作为数据经环境变量进入脚本，不拼进 shell 源码。
env:
  SITZFLEISCH_SUPABASE_URL: ${{ inputs.supabase_url || '' }}
  SITZFLEISCH_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase_publishable_key || '' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 校验公开同步配置
        shell: bash
        run: |
          node <<'NODE'
          const url = process.env.SITZFLEISCH_SUPABASE_URL ?? '';
          const key = process.env.SITZFLEISCH_SUPABASE_PUBLISHABLE_KEY ?? '';
          const fail = (message) => { console.error(message); process.exit(1); };
          if ((url === '') !== (key === '')) fail('项目地址和公开密钥必须同时填写或同时留空。');
          if (url === '') {
            console.log('未配置云同步，构建保留单机模式。');
            process.exit(0);
          }
          if (Buffer.byteLength(url, 'utf8') > 2048 || /[\s\u0000-\u001f\u007f]/u.test(url)) {
            fail('项目地址过长或包含空白/控制字符。');
          }
          let parsed;
          try { parsed = new URL(url); } catch { fail('项目地址格式无效。'); }
          if (parsed.protocol !== 'https:' || !parsed.hostname || parsed.username || parsed.password
              || parsed.pathname !== '/' || parsed.search || parsed.hash) {
            fail('项目地址必须是无账号、路径、查询参数和片段的 HTTPS 地址。');
          }
          if (key.length > 4096) fail('公开密钥过长。');
          const publishable = key.length >= 24 && /^sb_publishable_[A-Za-z0-9_-]+$/.test(key);
          let anon = false;
          if (key.length >= 40 && /^[A-Za-z0-9_.-]+$/.test(key) && key.split('.').length === 3) {
            try {
              const claims = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString('utf8'));
              anon = claims !== null && typeof claims === 'object' && claims.role === 'anon';
            } catch { /* 无效 JWT 不进入旧 anon 兼容分支。 */ }
          }
          if (!publishable && !anon) fail('仅接受 publishable/anon 公开密钥，禁止 secret/service_role 密钥。');
          console.log('公开同步配置校验通过。');
          NODE

  build:
    needs: validate
    if: github.event_name != 'workflow_dispatch' || !inputs.android_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable

      # macOS 出通用二进制，Intel 和 Apple 芯片各一半，装哪台都能跑。
      - name: Add Intel target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            src-tauri
            core

      - name: Install frontend dependencies
        run: npm ci

      - name: Rules engine tests
        run: cargo test
        working-directory: core

      - name: System integration tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Build app
        run: npm run tauri build ${{ matrix.target && format('-- --target {0}', matrix.target) || '' }}
        shell: bash

      # 不能叫 dist/：那是 Vite 前端的输出目录，会把 index.html 一起当成发行物传上去。
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*-setup.exe" \) -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sitzfleisch-${{ runner.os }}
          path: release-artifacts/*
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Android SDK 与 NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 此处只取得“是否齐全”的布尔值；三个 Secret 的值仍仅进入后面的签名步骤。
      # 标签发布或 android_only 都必须签名，不能生成无法覆盖正式安装的 debug 包。
      - name: 确定构建模式
        id: mode
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_KEY_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          ANDROID_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.android_only }}
        run: |
          set -euo pipefail
          if [[ "$HAS_SIGNING" == "true" ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [[ "$ANDROID_ONLY" == "true" ]]; then
            echo "仅构建 Android 模式需要完整的原有签名 Secrets，不能回退为 debug" >&2
            exit 1
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "发布标签缺少完整的 Android 签名 Secrets" >&2
            exit 1
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      # 构建期间磁盘上没有密钥：npm、Gradle 及其全部依赖都碰不到签名凭据。
      # release 模式产出未签名的 APK，下一步再单独签名。
      - name: Android APK
        env:
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
          RUSTFLAGS: -D warnings
        run: |
          if [[ "$BUILD_MODE" == "debug" ]]; then
            npm run tauri android build -- --debug --apk --target aarch64 --ci
          elif [[ "$BUILD_MODE" == "release" ]]; then
            npm run tauri android build -- --apk --target aarch64 --ci
          else
            echo "Android 构建模式无效" >&2
            exit 1
          fi

      - name: 签名发布 APK
        if: steps.mode.outputs.mode == 'release'
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -path "*/release/*.apk")
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "预期恰好一个 release APK" >&2
            exit 1
          fi
          KEYDIR="$RUNNER_TEMP/sitzfleisch-android-signing"
          mkdir -p "$KEYDIR"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$KEYDIR/release.jks"
          SIGNED="$RUNNER_TEMP/sitzfleisch-signed.apk"
          # 密码经环境变量交给 apksigner，不出现在命令行参数里。
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYDIR/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEY_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED" "${APKS[0]}"
          rm -rf "$KEYDIR"
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      - name: 校验并收集 Android 安装包
        env:
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          VERSION=$(node -e 'const v=require("./package.json").version; if(!/^\d+\.\d+\.\d+$/.test(v))process.exit(1); process.stdout.write(v)')
          mkdir -p release-artifacts
          if [[ "$BUILD_MODE" == "release" ]]; then
            SOURCE="$SIGNED_APK"
            APK="Sitzfleisch_${VERSION}_android-arm64.apk"
          else
            mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -path "*/debug/*.apk")
            if [[ "${#APKS[@]}" -ne 1 ]]; then
              echo "预期恰好一个 debug APK" >&2
              exit 1
            fi
            SOURCE="${APKS[0]}"
            # 调试包可调试、允许明文流量，名字上就要和正式包区分开，避免被误发。
            APK="Sitzfleisch_${VERSION}_android-arm64-debug.apk"
          fi
          cp "$SOURCE" "release-artifacts/$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "release-artifacts/$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "release-artifacts/$APK"
          (cd release-artifacts && sha256sum "$APK" > "$APK.sha256")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sitzfleisch-Android
          path: release-artifacts/*
          if-no-files-found: error

      - name: 清理签名临时文件
        if: always()
        run: rm -rf "$RUNNER_TEMP/sitzfleisch-android-signing" "$RUNNER_TEMP/sitzfleisch-signed.apk"

  release:
    needs: [build, android]
    # 手动构建只留 Artifacts；只有推送版本标签才发布正式 Release。
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && needs.android.outputs.build_mode == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          merge-multiple: true

      - run: ls -lh release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          files: release-artifacts/*
          draft: false
          generate_release_notes: false
          body: |
            ## 装法

            **macOS**：下载 `.dmg`，拖进「应用程序」。通用二进制，Intel 和 Apple 芯片都能跑。

            > 这个 app **没有 Apple 开发者签名和公证**（那要每年 99 美元的开发者账号）。
            > 首次打开 macOS 会拦，说「已损坏」或「无法验证开发者」。这不是真的损坏，
            > 在「应用程序」里**右键点图标 → 打开 → 再点一次「打开」**就行；
            > 或者在终端里跑一句：
            >
            > ```
            > xattr -dr com.apple.quarantine /Applications/Sitzfleisch.app
            > ```

            **Windows**：下载 `-setup.exe` 运行。SmartScreen 可能拦一下，点「更多信息 → 仍要运行」。
            **Windows 端从未在真机上验收过**，遇到问题请开 issue。

            **Android（ARM64，Android 8.0 及以上，系统 WebView 99 及以上）**：用手机浏览器下载 `…android-arm64.apk` 后打开。
            按系统提示允许浏览器安装未知应用；确认来自本仓库并核对 `.sha256` 后再继续安装。
            升级直接覆盖安装，记录保留；卸载会删除手机上的全部记录。
            首次「开始今天」时允许通知，再按「设置 → 提醒」里的提示打开横幅和后台运行，
            否则锁屏后的提醒可能只响不弹，或者不响。
            荣耀手机在「应用启动管理」里关闭坐功的自动管理，并把自启动、关联启动、后台活动三个开关都打开。
            手机重启后需打开一次坐功，才能恢复未来提醒。

            手机锁屏继续计时，不提供网站屏蔽；喝水提醒只在学习日内，本次暂停满 2 小时后
            不再发喝水和未开格提醒。手机与电脑的数据独立，不自动同步；首次需要在手机上设置项目和目标。

            手机可以用应用屏蔽代替网站屏蔽：在「设置 → 应用屏蔽」选好应用、打开开关，再按提示在系统无障碍设置里
            打开「坐功应用屏蔽」。用浏览器安装的坐功，那个开关可能是灰的：先到坐功的应用信息页，
            点右上角 ⋮ 选「允许受限制的设置」。坐功被强行停止后，系统会同时关掉这项服务，需要再打开一次；
            荣耀手机上这三个开关没打开时，划掉坐功就会被强行停止，请按上面的方法打开。

            ## 数据在哪

            只存在当前设备上，不联网、不上传。
            macOS `~/Library/Application Support/com.snooze26h.sitzfleisch.x/state.json`，
            Windows `%APPDATA%\com.snooze26h.sitzfleisch.x\state.json`。
            Android 保存在应用私有目录，卸载应用会删除。

            ## 网站屏蔽需要管理员密码

            学习日开始时把域名写进系统 hosts、收工时清掉，各要一次授权。不用这个功能就不会弹。
