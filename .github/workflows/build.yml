name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable

      # macOS 出通用二进制，Intel 和 Apple 芯片各一半，装哪台都能跑。
      - name: Add Intel target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            src-tauri
            core

      - name: Install frontend dependencies
        run: npm ci

      - name: Rules engine tests
        run: cargo test
        working-directory: core

      - name: System integration tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Build app
        run: npm run tauri build ${{ matrix.target && format('-- --target {0}', matrix.target) || '' }}
        shell: bash

      # 不能叫 dist/：那是 Vite 前端的输出目录，会把 index.html 一起当成发行物传上去。
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*-setup.exe" \) -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sitzfleisch-${{ runner.os }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          merge-multiple: true

      - run: ls -lh release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          files: release-artifacts/*
          draft: false
          generate_release_notes: false
          body: |
            ## 装法

            **macOS**：下载 `.dmg`，拖进「应用程序」。通用二进制，Intel 和 Apple 芯片都能跑。

            > 这个 app **没有 Apple 开发者签名和公证**（那要每年 99 美元的开发者账号）。
            > 首次打开 macOS 会拦，说「已损坏」或「无法验证开发者」。这不是真的损坏，
            > 在「应用程序」里**右键点图标 → 打开 → 再点一次「打开」**就行；
            > 或者在终端里跑一句：
            >
            > ```
            > xattr -dr com.apple.quarantine /Applications/Sitzfleisch.app
            > ```

            **Windows**：下载 `-setup.exe` 运行。SmartScreen 可能拦一下，点「更多信息 → 仍要运行」。
            **Windows 端从未在真机上验收过**，遇到问题请开 issue。

            ## 数据在哪

            只存在你自己电脑上，不联网、不上传。
            macOS `~/Library/Application Support/com.snooze26h.sitzfleisch.x/state.json`，
            Windows `%APPDATA%\com.snooze26h.sitzfleisch.x\state.json`。

            ## 网站屏蔽需要管理员密码

            学习日开始时把域名写进系统 hosts、收工时清掉，各要一次授权。不用这个功能就不会弹。
