[package]
name = "sitzfleisch-x"
version = "0.10.0"
description = "Sitzfleisch cross-platform (macOS + Windows)"
authors = ["snooze26h"]
edition = "2021"

[lib]
name = "sitzfleisch_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sitzfleisch-core = { path = "../core" }
# 原生托盘访问依赖当前小版本的类型，允许补丁更新，避免跨小版本改变桥接类型。
tauri = { version = "~2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSFont", "NSFontDescriptor", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation"] }
