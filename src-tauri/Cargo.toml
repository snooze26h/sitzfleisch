[package]
name = "sitzfleisch-x"
version = "0.12.1"
description = "Sitzfleisch cross-platform (macOS + Windows)"
authors = ["snooze26h"]
edition = "2021"

[lib]
name = "sitzfleisch_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sitzfleisch-core = { path = "../core" }
# 原生托盘访问依赖当前小版本的类型，允许补丁更新，避免跨小版本改变桥接类型。
tauri = { version = "~2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSError", "NSGeometry", "NSNotification", "NSOperation", "NSRunLoop", "NSString", "NSTimer", "NSValue", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSCell", "NSControl", "NSFont", "NSFontDescriptor", "NSGraphics", "NSImage", "NSImageView", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKSnapshotConfiguration", "WKWebView", "block2", "objc2-app-kit", "objc2-core-foundation"] }
